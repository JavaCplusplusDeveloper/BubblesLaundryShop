<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Settings</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="/styles/settings.css">

    </head>
    
    <body>
         <div class="app-container">
            
            <div class="sidebar">
                <div class="brand-name">Bubbles Mini Store</div>
                <a href="/" class="nav-btn-alt">Queue</a>
                <a href="/inventory" class="nav-btn-alt">Inventory</a>
                <a href="/history" class="nav-btn-alt">History</a>
                <button class="nav-btn">Settings</button>
               <div style ="text-align: center;">
                <img source="/image/download.jpg" style="margin-top:100px;" height="200" width="200" >
            </div>

            </div>
            
            <div class="main-content">
                
                <div class="main-header">
                    <div>
                        <h1>Settings</h1>
                    </div>
                </div>
                
                <hr class="header-line">

            <div class="settings-panel-card">
    <div class="panel-header-group">
        <h3 class="panel-title">⚠️ Inventory Alert</h3>
        <p class="panel-hint">Set when to receive low stock warnings for each item...</p>
    </div>

    <div class="alert-rows-container">
        <div class="alert-item-row">
            <div class="item-profile-side">
                <div class="item-graphic-icon">🧼</div>
                <div class="item-label-details">
                    <span class="item-name-text">Detergent</span>
                    <span class="item-stock-status">(Current Stock)</span>
                </div>
            </div>
            <div class="item-control-side">
                <span class="control-instruction-label">Alert when below:</span>
                <input type="number" id="detergentInput" class="alert-threshold-input" th:value="${detergentLimit ?: 10}">
                <span class="bell-toggle-icon" onclick="saveAlertThresholds()"title="Save threshold">🔔</span>
            </div>
        </div>

        <div class="alert-item-row">
            <div class="item-profile-side">
                <div class="item-graphic-icon">🌸</div>
                <div class="item-label-details">
                    <span class="item-name-text">Fabcon</span>
                    <span class="item-stock-status">(Current Stock)</span>
                </div>
            </div>
            <div class="item-control-side">
                <span class="control-instruction-label">Alert when below:</span>
                <input type="number" id="fabconInput" class="alert-threshold-input" th:value="${fabconLimit ?: 10}">
                <span class="bell-toggle-icon" onclick="saveAlertThresholds()"title="Save threshold">🔔</span>
            </div>
        </div>

        <div class="alert-item-row">
            <div class="item-profile-side">
                <div class="item-graphic-icon">🧪</div>
                <div class="item-label-details">
                    <span class="item-name-text">Bleach</span>
                    <span class="item-stock-status">(Current Stock)</span>
                </div>
            </div>
            <div class="item-control-side">
                <span class="control-instruction-label">Alert when below:</span>
                <input type="number" id="bleachInput" class="alert-threshold-input" th:value="${bleachLimit ?: 10}">
                <span class="bell-toggle-icon" onclick="saveAlertThresholds()"  title="Save threshold">🔔</span>
            </div>
        </div>
    </div>
</div> 
         <script th:src="@{/script/settings.js}"></script>

        <

            </body>
</html>
