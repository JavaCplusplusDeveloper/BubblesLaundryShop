<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard One</title>
  <style>
    *{
        margin: 0px;
        border: 0px;
    }
    body{
        display: flex;
        width: 100%;
        height: 100%;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    .sidebar{
        top: 0px;
        bottom: 0px;
        left: 0px;
        position : fixed;
        width: 280px;
        padding: 25px 20px;
        background-color: rgb(47, 47, 198);
        flex-direction: column;
    }
    
    .sidebar-container{
      display: flex;
      flex-direction: column;
      gap: 10px;

    }
    .title{
      color: white;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 40px;
    }
    
    .current-btn{
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgb(55, 82, 234);
      color: rgb(255, 255, 255);
      height: 55px;
      border-radius: 6px;
      border-style: solid;
      border-width: 2px;

    }
    
    .alt-btn{
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgb(255, 255, 255);
      color: rgb(55, 82, 234);
      height: 55px;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      border-style: solid;
      border-width: 2px;
    }

    .logo{
      margin-top: 50px;
      height: 250px;
      width: 280px;
      align-items: center;
      justify-content: center;
    }

    /*Header main cotent*/
    .queue-section{
      flex-direction: row;
      background-color: rgb(39, 72, 170);
      height: 100vh;
      width: 100%;
      display: flex;
      padding: 25px,20px ;
      margin-left: 320px;
      
    }
    
    .header-container{
      display: flex;
      flex-direction: row;
      height: 50px;
      width: 100%;
      padding: 20px 15px;
      background-color: rgb(28, 59, 151);
      margin-bottom: 1px;
      position: fixed;
    }
    
    .counter-screen{
      display: flex;
      flex-direction: row;
      height: 50px;
      width: 100%;
      background-color: white;
      padding: 20px 25px;
      
    }
    .sub-title{
      color: white; 
      font-size: 34px; 
      margin-left: 20px; 
      font-weight: bold;
    }
  </style>
  </head>
  <body>
    
    <div class="sidebar">
      <div class="title">PSJ's Laundry Shop</div>
      <div class="sidebar-container">
        <button class="current-btn">Dashboard</button>
        <a href="/inventory" alt="Inventory Tab" class="alt-btn">Inventory</a>
        <a href="/history" alt="History Tab" class="alt-btn">History</a>
        <a href="/settings" alt="Settings Tab" class="alt-btn">Settings</a>
        <img src="logo.jpg" alt="Logo of the Laundry Shop" class="logo"/>
      </div>
    </div>

    <div class="queue-section">
      <div class="header-container">
        <div class="sub-title">Order Queue</div>
        

      </div>
      
    </div>

  </body>
</html>
